<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sayt Statistikasi</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f4; color: #1c1917; padding: 40px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { color: #166534; margin-top: 0; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .stat-card { background: #fdfbf7; border: 1px solid rgba(20, 83, 45, 0.1); padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card h3 { margin: 0 0 10px 0; color: #57534e; font-size: 1.1rem; }
        .stat-card .number { font-size: 3rem; font-weight: bold; color: #059669; }
        .history { margin-top: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e5e5e5; }
        th { color: #166534; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #059669; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Asosiy saytga qaytish</a>
        <h1>Sayt Statistikasi (Admin)</h1>
        <p>Foydalanuvchilar qancha marotaba kirganligini real vaqtda shu yerdan ko'rishingiz mumkin.</p>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Umumiy Tashriflar</h3>
                <div class="number" id="total-visits">...</div>
            </div>
            <div class="stat-card">
                <h3>Bugungi Tashriflar</h3>
                <div class="number" id="today-visits">...</div>
            </div>
        </div>

        <div class="history">
            <h3>Kunlik Tarix (Oxirgi 7 kun)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Sana (Yil-Oy-Kun)</th>
                        <th>Tashriflar soni</th>
                    </tr>
                </thead>
                <tbody id="history-table">
                    <tr><td colspan="2">Yuklanmoqda...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof firebase === 'undefined' || !firebase.database) {
                alert("Firebase ulanmagan!");
                return;
            }

            const db = firebase.database();
            const today = new Date().toISOString().split('T')[0];

            // Umumiy
            db.ref('statistics/total_visits').on('value', snap => {
                document.getElementById('total-visits').innerText = snap.val() || 0;
            });

            // Bugun
            db.ref(`statistics/daily_visits/${today}`).on('value', snap => {
                document.getElementById('today-visits').innerText = snap.val() || 0;
            });

            // Tarix
            db.ref('statistics/daily_visits').orderByKey().limitToLast(7).on('value', snap => {
                const tbody = document.getElementById('history-table');
                tbody.innerHTML = '';
                const data = snap.val() || {};
                const keys = Object.keys(data).reverse(); // eng yangisi tepada

                if (keys.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2">Hozircha ma\'lumot yo\'q.</td></tr>';
                    return;
                }

                keys.forEach(date => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${date}</td><td><b>${data[date]}</b> kishi</td>`;
                    tbody.appendChild(tr);
                });
            });
        });
    </script>
</body>
</html>
