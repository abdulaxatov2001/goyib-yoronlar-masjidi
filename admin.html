<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | G'oyib Yoronlar Masjidi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <style>
        :root {
            --green: #064e3b;
            --gold: #d4a017;
            --bg: #071410;
            --glass: rgba(6, 78, 59, 0.25);
            --border: rgba(212, 160, 23, 0.25);
            --text: #f1f5f9;
            --muted: rgba(241, 245, 249, 0.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 30%, rgba(6, 78, 59, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(212, 160, 23, 0.08) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
        }

        /* ─── Kartalar ─── */
        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(16px);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo i {
            font-size: 2.5rem;
            color: var(--gold);
            display: block;
            margin-bottom: 10px;
        }

        .logo h1 {
            font-size: 1.4rem;
            color: var(--gold);
            font-weight: 700;
        }

        .logo p {
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 4px;
        }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
            margin-bottom: 6px;
            margin-top: 20px;
        }

        input,
        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            padding: 14px 18px;
            font-size: 1.05rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--gold);
            background: rgba(212, 160, 23, 0.06);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            width: 100%;
            margin-top: 24px;
            background: var(--gold);
            color: #071410;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.88;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        /* ─── Xabarlar ─── */
        .msg {
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 0.9rem;
            margin-top: 18px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .msg.success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #86efac;
        }

        .msg.error {
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.35);
            color: #fca5a5;
        }

        .msg.show {
            display: flex;
        }

        /* ─── Tabs ─── */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 10px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--muted);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            transition: 0.2s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .tab.active {
            background: var(--gold);
            color: #071410;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Namoz seti */
        .prayer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 24px;
        }

        .time-input-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        input[type="time"] {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--gold);
            padding: 10px 5px;
            outline: none;
        }

        .time-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--muted);
            padding: 0 16px;
            height: 100%;
            min-height: 48px;
            cursor: pointer;
        }

        .time-btn:hover {
            color: var(--gold);
            background: rgba(212, 160, 23, 0.15);
        }

        .prayer-field label {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* Ro'yxat (Yangiliklar, Jamoa) */
        .list-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item-info h4 {
            color: var(--gold);
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .list-item-info p {
            color: var(--muted);
            font-size: 0.8rem;
        }

        .list-item-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
        }

        .list-item-actions button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 5px;
        }

        .list-item-actions button.btn-edit:hover {
            color: var(--gold);
        }
        .list-item-actions button.btn-del:hover {
            color: #fca5a5;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .top-bar a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fb-warn {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 0.85rem;
            color: #fde68a;
            margin-bottom: 20px;
            line-height: 1.5;
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ─── Mobil moslashuvchanlik ─── */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .card {
                padding: 24px 16px;
                margin-top: 10px;
                margin-bottom: 10px;
                border-radius: 18px;
            }
            .prayer-grid {
                grid-template-columns: 1fr;
            }
            #gallery-list {
                grid-template-columns: 1fr !important;
            }
            .tabs {
                flex-wrap: wrap;
                gap: 6px;
            }
            .tab {
                flex: 1 1 calc(50% - 6px);
                text-align: center;
                padding: 12px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- Login -->
    <div class="card" id="login-card">
        <div class="logo">
            <i class="fas fa-mosque"></i>
            <h1>Admin Panel</h1>
            <p>G'oyib Yoronlar Jome Masjidi</p>
        </div>
        <div class="fb-warn" id="fb-status"></div>
        <label><i class="fas fa-lock" style="margin-right:5px"></i>Parol</label>
        <input type="password" id="pwd" placeholder="Masjid admin paroli..."
            onkeydown="if(event.key==='Enter') doLogin()">
        <button class="btn" id="login-btn" onclick="doLogin()"><i class="fas fa-sign-in-alt"
                style="margin-right:8px"></i>Kirish</button>
        <div class="msg error" id="login-err"><i class="fas fa-exclamation-circle"></i> Noto'g'ri parol!</div>
        <div style="text-align:center;margin-top:20px"><a href="index.html"
                style="color:var(--muted);font-size:0.82rem;text-decoration:none">← Saytga qaytish</a></div>
    </div>

    <!-- Admin Panel -->
    <div class="card" id="admin-card" style="display:none">
        <div class="top-bar">
            <div class="logo" style="text-align:left;margin:0">
                <h1 style="font-size:1.1rem"><i class="fas fa-cogs"
                        style="color:var(--gold);margin-right:8px"></i>Boshqaruv</h1>
            </div>
            <div style="display:flex;gap:12px">
                <a href="index.html"><i class="fas fa-home"></i> Sayt</a>
                <a href="#" onclick="doLogout()" style="color:#fca5a5"><i class="fas fa-sign-out-alt"></i> Chiqish</a>
            </div>
        </div>
        <div class="fb-warn" id="admin-fb-status"></div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('tab-stats')">Statistika</div>
            <div class="tab" onclick="switchTab('tab-prayer')">Vaqtlar</div>
            <div class="tab" onclick="switchTab('tab-news')">Yangiliklar</div>
            <div class="tab" onclick="switchTab('tab-team')">Jamoa</div>
            <div class="tab" onclick="switchTab('tab-gallery')">Galereya</div>
        </div>

        <!-- STATISTIKA -->
        <div id="tab-stats" class="tab-content active">
            <div style="display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap;">
                <div style="flex:1; background:rgba(255,255,255,0.05); padding:20px; border-radius:12px; border:1px solid var(--border); text-align:center;">
                    <i class="fas fa-eye" style="font-size:2rem; color:var(--gold); margin-bottom:10px;"></i>
                    <h3 style="color:var(--text); font-size:1.1rem; margin-bottom:5px;">Umumiy tashriflar</h3>
                    <p id="stat-total" style="font-size:1.8rem; font-weight:bold; color:var(--gold);">0</p>
                </div>
                <div style="flex:1; background:rgba(255,255,255,0.05); padding:20px; border-radius:12px; border:1px solid var(--border); text-align:center;">
                    <i class="fas fa-calendar-day" style="font-size:2rem; color:#34d399; margin-bottom:10px;"></i>
                    <h3 style="color:var(--text); font-size:1.1rem; margin-bottom:5px;">Bugungi tashriflar</h3>
                    <p id="stat-today" style="font-size:1.8rem; font-weight:bold; color:#34d399;">0</p>
                </div>
            </div>
            <div style="text-align:center;">
                <button class="btn" style="width:auto; padding:10px 20px; font-size:0.9rem;" onclick="loadStats()"><i class="fas fa-sync"></i> Yangilash</button>
            </div>
        </div>

        <!-- NAMOZ VAQTLARI -->
        <div id="tab-prayer" class="tab-content">
            <p style="font-size:0.85rem;color:var(--muted);margin-bottom:15px">Masjidda amalda o'qiladigan vaqtlarni
                kiriting:</p>
            <div class="prayer-grid">
                <div class="prayer-field">
                    <label><i class="fas fa-sun" style="color:#fbbf24"></i> Bomdod</label>
                    <div class="time-input-group">
                        <button class="time-btn" onclick="adjustTime('bomdod', -1)"><i
                                class="fas fa-minus"></i></button>
                        <input type="time" id="t-bomdod">
                        <button class="time-btn" onclick="adjustTime('bomdod', 1)"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
                <div class="prayer-field">
                    <label><i class="fas fa-sun" style="color:#f97316"></i> Peshin</label>
                    <div class="time-input-group">
                        <button class="time-btn" onclick="adjustTime('peshin', -1)"><i
                                class="fas fa-minus"></i></button>
                        <input type="time" id="t-peshin">
                        <button class="time-btn" onclick="adjustTime('peshin', 1)"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
                <div class="prayer-field">
                    <label><i class="fas fa-cloud-sun" style="color:#fb923c"></i> Asr</label>
                    <div class="time-input-group">
                        <button class="time-btn" onclick="adjustTime('asr', -1)"><i class="fas fa-minus"></i></button>
                        <input type="time" id="t-asr">
                        <button class="time-btn" onclick="adjustTime('asr', 1)"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
                <div class="prayer-field">
                    <label><i class="fas fa-moon" style="color:#a5b4fc"></i> Shom</label>
                    <div class="time-input-group">
                        <button class="time-btn" onclick="adjustTime('shom', -1)"><i class="fas fa-minus"></i></button>
                        <input type="time" id="t-shom">
                        <button class="time-btn" onclick="adjustTime('shom', 1)"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
                <div class="prayer-field">
                    <label><i class="fas fa-star" style="color:#818cf8"></i> Xufton</label>
                    <div class="time-input-group">
                        <button class="time-btn" onclick="adjustTime('xufton', -1)"><i
                                class="fas fa-minus"></i></button>
                        <input type="time" id="t-xufton">
                        <button class="time-btn" onclick="adjustTime('xufton', 1)"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
            </div>
            <button class="btn" onclick="savePrayers()"><i class="fas fa-save" style="margin-right:8px"></i>Vaqtlarni
                Saqlash</button>
            <div class="msg success" id="prayer-ok"><i class="fas fa-check-circle"></i> Saqlandi!</div>
        </div>

        <!-- YANGILIKLAR -->
        <div id="tab-news" class="tab-content">
            <label>Sarlavha</label>
            <input type="text" id="news-title" placeholder="Yangilik sarlavhasi...">
            <label>Matn</label>
            <textarea id="news-desc" placeholder="Batafsil ma'lumot..."></textarea>
            <label>Rasm yuklash</label>
            <input type="file" id="news-img" accept="image/*" style="padding:10px">
            <button class="btn" id="btn-save-news" onclick="addNews()"><i class="fas fa-plus"
                    style="margin-right:8px"></i>Yangilik Qo'shish</button>
            <div class="msg success" id="news-ok"></div>
            <div id="news-list"></div>
        </div>

        <!-- JAMOA -->
        <div id="tab-team" class="tab-content">
            <label>Ism-Sharif</label>
            <input type="text" id="team-name" placeholder="Masalan: Mardonbek domla...">
            <label>Vazifasi</label>
            <input type="text" id="team-role" placeholder="Masalan: Imom Xatib...">
            <label>Ta'rifi</label>
            <textarea id="team-desc" placeholder="Xodim haqida qisqacha ma'lumot..."></textarea>
            <label>Rasm yuklash</label>
            <input type="file" id="team-img" accept="image/*" style="padding:10px">
            <button class="btn" id="btn-save-team" onclick="addTeam()"><i class="fas fa-plus"
                    style="margin-right:8px"></i>Xodim Qo'shish</button>
            <div class="msg success" id="team-ok"></div>
            <div id="team-list"></div>
        </div>

        <!-- GALEREYA -->
        <div id="tab-gallery" class="tab-content">
            <label>Yangi rasm yuklash</label>
            <input type="file" id="gallery-img" accept="image/*" style="padding:10px" multiple>
            <button class="btn" id="btn-save-gallery" onclick="addGallery()"><i class="fas fa-upload"
                    style="margin-right:8px"></i>Rasmlarni Yuklash</button>
            <div class="msg success" id="gallery-ok"></div>
            <div id="gallery-list" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;"></div>
        </div>

    </div>

    <script>
        const ADMIN_PASS = 'masjid2026';
        let db = null;
        const IMGBB_API_KEY = '0b33f824585f0a48f47c96d673cd0907'; // <-- ImgBB API kalitini shu yerga yozasiz
        let fbReady = false;
        let editingNewsKey = null;
        let editingTeamKey = null;
        let oldImgUrl = null;

        window.addEventListener('load', () => {
            try {
                if (typeof firebaseConfig === 'undefined') throw new Error('firebase-config.js yuklanmadi');
                if (!firebaseConfig.databaseURL || firebaseConfig.apiKey === 'SIZNING_API_KALITINGIZ') {
                    throw new Error('Firebase sozlanmagan');
                }
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                fbReady = true;
            } catch (e) {
                document.getElementById('fb-status').innerHTML = e.message;
                document.getElementById('fb-status').style.display = 'block';
            }
        });

        function doLogin() {
            if (document.getElementById('pwd').value === ADMIN_PASS) {
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('admin-card').style.display = 'block';
                loadPrayers();
                loadList('news');
                loadList('team');
                loadGallery();
                loadStats(); // Statistikani yuklash
            } else {
                document.getElementById('login-err').classList.add('show');
            }
        }

        // --- STATISTIKA (Analytics) funksiyasi ---
        function loadStats() {
            if (!db) return;
            const today = new Date().toISOString().split('T')[0];
            const statsRef = db.ref('statistics');
            
            statsRef.once('value').then(snapshot => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const total = data.total_visits || 0;
                    const todays = data.daily_visits && data.daily_visits[today] ? data.daily_visits[today] : 0;
                    
                    document.getElementById('stat-total').textContent = total;
                    document.getElementById('stat-today').textContent = todays;
                }
            }).catch(e => console.error("Stats load err:", e));
        }

        function doLogout() { location.reload(); }

        function switchTab(id) {
            document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        // ================= PRAYER TIMES =================
        function adjustTime(key, min) {
            const el = document.getElementById('t-' + key);
            let [h, m] = (el.value || "00:00").split(':').map(Number);
            let tot = h * 60 + m + min;
            if (tot < 0) tot += 24 * 60;
            tot %= 24 * 60;
            el.value = String(Math.floor(tot / 60)).padStart(2, '0') + ':' + String(tot % 60).padStart(2, '0');
        }

        function loadPrayers() {
            if (!fbReady) return;
            db.ref('prayer_times').once('value').then(s => {
                const d = s.val() || {};
                ['bomdod', 'peshin', 'asr', 'shom', 'xufton'].forEach(k => {
                    if (d[k]) document.getElementById('t-' + k).value = d[k];
                });
            });
        }
        function savePrayers() {
            if (!fbReady) return;
            const data = {};
            ['bomdod', 'peshin', 'asr', 'shom', 'xufton'].forEach(k => {
                data[k] = document.getElementById('t-' + k).value;
            });
            data.last_update = new Date().toISOString();
            db.ref('prayer_times').set(data).then(() => {
                const msg = document.getElementById('prayer-ok');
                msg.classList.add('show');
                setTimeout(() => msg.classList.remove('show'), 3000);
            });
        }

        // ================= UPLOAD UTILS (ImgBB) =================
        async function uploadImage(file) {
            if (!file) return null;
            if (IMGBB_API_KEY === 'SIZNING_IMGBB_API_KALITINGIZ') {
                throw new Error("ImgBB API kaliti kiritilmagan! Iltimos admin.html kodidagi 266-qatorga o'z API kalitingizni yozing.");
            }
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            if (data.success) {
                return data.data.url;
            } else {
                throw new Error(data.error.message);
            }
        }

        // ================= NEWS & TEAM (CRUD) =================
        async function addNews() {
            const btn = document.getElementById('btn-save-news');
            const title = document.getElementById('news-title').value;
            const desc = document.getElementById('news-desc').value;
            const file = document.getElementById('news-img').files[0];
            if (!title || !desc) return alert("Sarlavha va matnni kiriting!");

            btn.innerHTML = `<span class="spinner"></span> Yuklanmoqda...`;
            btn.disabled = true;
            try {
                let imgUrl = file ? await uploadImage(file) : oldImgUrl;
                if (editingNewsKey) {
                    await db.ref('news').child(editingNewsKey).update({
                        title, desc, imgUrl: imgUrl || '', date: new Date().toLocaleDateString('ru-RU')
                    });
                    editingNewsKey = null;
                } else {
                    await db.ref('news').push({
                        title, desc, imgUrl: imgUrl || '', date: new Date().toLocaleDateString('ru-RU')
                    });
                }
                oldImgUrl = null;
                document.getElementById('news-title').value = '';
                document.getElementById('news-desc').value = '';
                document.getElementById('news-img').value = '';
                loadList('news');
            } catch (e) { alert(e.message); }
            btn.innerHTML = `<i class="fas fa-plus" style="margin-right:8px"></i>Yangilik Qo'shish`;
            btn.disabled = false;
        }

        async function addTeam() {
            const btn = document.getElementById('btn-save-team');
            const name = document.getElementById('team-name').value;
            const role = document.getElementById('team-role').value;
            const desc = document.getElementById('team-desc').value;
            const file = document.getElementById('team-img').files[0];
            if (!name || !role) return alert("Ism va vazifani kiriting!");

            btn.innerHTML = `<span class="spinner"></span> Yuklanmoqda...`;
            btn.disabled = true;
            try {
                let imgUrl = file ? await uploadImage(file) : oldImgUrl;
                if (editingTeamKey) {
                    await db.ref('team').child(editingTeamKey).update({
                        name, role, desc, imgUrl: imgUrl || ''
                    });
                    editingTeamKey = null;
                } else {
                    await db.ref('team').push({ name, role, desc, imgUrl: imgUrl || '' });
                }
                oldImgUrl = null;
                document.getElementById('team-name').value = '';
                document.getElementById('team-role').value = '';
                document.getElementById('team-desc').value = '';
                document.getElementById('team-img').value = '';
                loadList('team');
            } catch (e) { alert(e.message); }
            btn.innerHTML = `<i class="fas fa-plus" style="margin-right:8px"></i>Xodim Qo'shish`;
            btn.disabled = false;
        }

        function loadList(type) {
            if (!fbReady) return;
            db.ref(type).on('value', snap => {
                const container = document.getElementById(type + '-list');
                container.innerHTML = '';
                snap.forEach(child => {
                    const v = child.val();
                    const title = type === 'news' ? v.title : v.name;
                    const subtitle = type === 'news' ? v.date : v.role;
                    const img = v.imgUrl ? `<img src="${v.imgUrl}" class="list-item-img">` : `<div class="list-item-img" style="background:#333;display:flex;align-items:center;justify-content:center"><i class="fas fa-image"></i></div>`;
                    
                    let editBtnHtml = '';
                    if (type === 'news' || type === 'team') {
                        editBtnHtml = `<button class="btn-edit" onclick="editItem('${type}', '${child.key}')"><i class="fas fa-edit"></i></button>`;
                    }

                    container.innerHTML += `
                <div class="list-item">
                    <div style="display:flex;align-items:center">
                        ${img}
                        <div class="list-item-info"><h4>${title}</h4><p>${subtitle}</p></div>
                    </div>
                    <div class="list-item-actions">
                        ${editBtnHtml}
                        <button class="btn-del" onclick="deleteItem('${type}', '${child.key}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
                });
            });
        }

        function deleteItem(type, key) {
            if (confirm("Haqiqatan ham o'chirmoqchimisiz?")) {
                db.ref(type).child(key).remove();
            }
        }

        function editItem(type, key) {
            db.ref(type).child(key).once('value').then(snap => {
                const v = snap.val();
                if (type === 'news') {
                    editingNewsKey = key;
                    oldImgUrl = v.imgUrl || null;
                    document.getElementById('news-title').value = v.title;
                    document.getElementById('news-desc').value = v.desc;
                    document.getElementById('btn-save-news').innerHTML = `<i class="fas fa-save" style="margin-right:8px"></i>Yangilash`;
                    switchTab('tab-news');
                    window.scrollTo(0, 0);
                } else if (type === 'team') {
                    editingTeamKey = key;
                    oldImgUrl = v.imgUrl || null;
                    document.getElementById('team-name').value = v.name;
                    document.getElementById('team-role').value = v.role;
                    document.getElementById('team-desc').value = v.desc || '';
                    document.getElementById('btn-save-team').innerHTML = `<i class="fas fa-save" style="margin-right:8px"></i>Yangilash`;
                    switchTab('tab-team');
                    window.scrollTo(0, 0);
                }
            });
        }

        // ================= GALLERY =================
        async function addGallery() {
            const btn = document.getElementById('btn-save-gallery');
            const files = document.getElementById('gallery-img').files;
            if (files.length === 0) return alert("Rasm tanlang!");

            btn.innerHTML = `<span class="spinner"></span> Yuklanmoqda...`;
            btn.disabled = true;
            try {
                for (let i = 0; i < files.length; i++) {
                    let imgUrl = await uploadImage(files[i]);
                    if (imgUrl) await db.ref('gallery').push({ url: imgUrl, date: Date.now() });
                }
                document.getElementById('gallery-img').value = '';
                loadGallery();
            } catch (e) { alert(e.message); }
            btn.innerHTML = `<i class="fas fa-upload"></i> Rasmlarni Yuklash`;
            btn.disabled = false;
        }

        function loadGallery() {
            if (!fbReady) return;
            db.ref('gallery').on('value', snap => {
                const container = document.getElementById('gallery-list');
                container.innerHTML = '';
                snap.forEach(child => {
                    const v = child.val();
                    container.innerHTML += `
                <div style="position:relative; border-radius:8px; overflow:hidden; aspect-ratio:1;">
                    <img src="${v.url}" style="width:100%;height:100%;object-fit:cover;">
                    <button onclick="deleteItem('gallery', '${child.key}')" style="position:absolute;top:5px;right:5px;background:rgba(0,0,0,0.5);border:none;color:white;padding:5px;border-radius:4px;cursor:pointer"><i class="fas fa-trash"></i></button>
                </div>
            `;
                });
            });
        }
    </script>
</body>

</html>
